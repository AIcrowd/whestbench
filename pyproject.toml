[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whestbench"]

[project]
name = "whestbench"
version = "0.16.2"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "datasets>=2.20",
    "faker~=37.0",
    # Phase 2 meter: 0.12.2 corrects broadcast/dtype billing and symmetry
    # discounts; 0.12.3 adds the rank-dependent work in truncated SVD.
    # Raise the server floor in lockstep and run test_torch_flop_synthesis.py
    # to verify that published sampling-budget breakdowns still match.
    "flopscope>=0.12.3,<0.13.0",
    "httpx>=0.27",
    "huggingface_hub>=0.24",
    "jinja2>=3.1",
    "plotext",
    "pyarrow>=14",
    "pyyaml>=6.0",
    "rich",
    "threadpoolctl>=3.0",
    "toml>=0.10",
    "tqdm",
]

[project.scripts]
whest = "whestbench.cli:main"
whestbench = "whestbench.cli:main"

[project.optional-dependencies]
gpu = ["torch>=2.1"]

[dependency-groups]
dev = [
    "commitizen>=4.0",
    "gitlint>=0.19",
    "pytest>=8.2.0",
    "pyright>=1.1.0",
    "ruff>=0.6.0",
]
server = [
    "flopscope-server>=0.12.3,<0.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
include = [
    "src",
    "tests",
    "main.py",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
# Conventional-commit prefix for the bump commit. cz defaults to
# "bump: version $current_version → $new_version", and `bump` is not a type
# .gitlint accepts -- which never surfaced while bumps went straight to main,
# because `gitlint --commits origin/main..HEAD` has nothing to check there.
# Cutting a release through a PR exposes it.
bump_message = "chore(release): bump version $current_version to $new_version"
update_changelog_on_bump = true
major_version_zero = true
changelog_incremental = true
