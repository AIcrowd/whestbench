[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whestbench"]

[project]
name = "whestbench"
version = "0.14.0"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "datasets>=2.20",
    "faker~=37.0",
    "flopscope>=0.11.0,<0.12.0",  # 0.11.0: the >52-letter contraction fallback now bills the honest FMA count, so padding both tensordot operands with singleton axes no longer buys the arithmetic at ~half price (~2x on affected calls; tensordot only — matmul uses ellipsis subscripts), and `ix_` moves from a shipped weight of 0.0 to 1.0. Both move FLOPs the GRADER charges for calls that already ran — scored submissions need RE-EVALUATION, not just a re-baseline. BREAKING: non-numeric dtypes (object, str, bytes, datetime64, timedelta64, structured/void) now raise UnsupportedDtypeError wherever they reach a metered op, on a numeric allowlist (dtype.kind in "biufc"). Separately, linalg/cross/outer/contraction/fft/bmat results are now wrapped so downstream arithmetic is billed LOCALLY — that raises the in-process estimate onto what the grader already charged and implies no re-eval. Floor pinned to 0.11.0 so CI's `--upgrade-package` resolution is deterministic; whestbench-evaluator moves its own v0.10.0 pins to v0.11.0 once this release is tagged (they are an atomic pair). <0.12.0 caps the next breaking minor.
    "httpx>=0.27",
    "huggingface_hub>=0.24",
    "jinja2>=3.1",
    "plotext",
    "pyarrow>=14",
    "pyyaml>=6.0",
    "rich",
    "threadpoolctl>=3.0",
    "toml>=0.10",
    "tqdm",
]

[project.scripts]
whest = "whestbench.cli:main"
whestbench = "whestbench.cli:main"

[project.optional-dependencies]
gpu = ["torch>=2.1"]

[dependency-groups]
dev = [
    "commitizen>=4.0",
    "gitlint>=0.19",
    "pytest>=8.2.0",
    "pyright>=1.1.0",
    "ruff>=0.6.0",
]
server = [
    "flopscope-server>=0.11.0,<0.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
include = [
    "src",
    "tests",
    "main.py",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
changelog_incremental = true
