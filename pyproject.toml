[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whestbench"]

[project]
name = "whestbench"
version = "0.16.0"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "datasets>=2.20",
    "faker~=37.0",
    "flopscope>=0.12.0,<0.13.0",  # 0.12.0 is the Phase 2 meter. It corrects ~40 prices that did not match what the operations actually compute — nan-prefixed reductions now charge their NaN-scan pass, six boolean-returning ops that compute in a promoted float dtype move by exactly 2x (this includes is_symmetric/as_symmetric, which bill allclose's formula), and einsum path search, multi-output ufuncs, fill_diagonal(wrap=True) and SymmetricTensor construction are repriced. Some prices rise and some fall, so estimator totals move in both directions. flopscope's own CHANGELOG is explicit that this ships as a new version opening a new phase: nothing already scored is repriced, so no re-evaluation is owed for Phase 1. <0.13.0 caps the next breaking minor. Bump this in lockstep with flopscope-server below, and re-run tests/test_torch_flop_synthesis.py — it is the gate on whether a bump invalidates published dataset revisions.
    "httpx>=0.27",
    "huggingface_hub>=0.24",
    "jinja2>=3.1",
    "plotext",
    "pyarrow>=14",
    "pyyaml>=6.0",
    "rich",
    "threadpoolctl>=3.0",
    "toml>=0.10",
    "tqdm",
]

[project.scripts]
whest = "whestbench.cli:main"
whestbench = "whestbench.cli:main"

[project.optional-dependencies]
gpu = ["torch>=2.1"]

[dependency-groups]
dev = [
    "commitizen>=4.0",
    "gitlint>=0.19",
    "pytest>=8.2.0",
    "pyright>=1.1.0",
    "ruff>=0.6.0",
]
server = [
    "flopscope-server>=0.12.0,<0.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
include = [
    "src",
    "tests",
    "main.py",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
changelog_incremental = true
