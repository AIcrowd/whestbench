name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/generate_docs.py'
      - 'scripts/sync_starterkit_docs.py'
      - 'website/**'
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv python install 3.12
      - name: Install Python dependencies
        run: uv sync --all-extras
      - name: Generate API + CLI data
        run: uv run python scripts/generate_docs.py
      - name: Verify doc coverage
        run: uv run python scripts/generate_docs.py --verify
      - name: Federate starter-kit docs (pinned)
        run: uv run python scripts/sync_starterkit_docs.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json
      - name: Install website dependencies
        run: cd website && npm ci
      - name: Build website
        run: cd website && npm run build
      - name: GH Pages compatibility checks
        run: cd website && npm run check:gh-pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
